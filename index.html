<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoW Housing Decor Sourcing Tool</title>
    <style>
        :root {
            --bg-color: #121417;
            --panel-bg: #1b1e24;
            --border-color: #2e3440;
            --accent-color: #dca842;
            --text-main: #e5e9f0;
            --text-muted: #9aa5b5;
            --badge-bg: #2a313d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header { margin-bottom: 20px; }
        h1 { color: var(--accent-color); margin: 0 0 8px 0; font-size: 1.8rem; }

        .status-bar {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .status-loading { background: #2c2514; color: #f0c674; border: 1px solid #634f24; }
        .status-success { background: #18281e; color: #81c784; border: 1px solid #2e5339; }
        .status-error { background: #2d1818; color: #e57373; border: 1px solid #5a2c2c; }

        textarea {
            width: 100%;
            height: 180px;
            background-color: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            box-sizing: border-box;
            resize: vertical;
        }
        textarea:focus { outline: none; border-color: var(--accent-color); }

        button {
            background-color: var(--accent-color);
            color: #121417;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            transition: opacity 0.15s ease;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .results-container { margin-top: 30px; display: flex; flex-direction: column; gap: 16px; }
        .vendor-card { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        .vendor-header {
            background-color: rgba(220, 168, 66, 0.08);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
        }
        .vendor-name { font-size: 1.15rem; font-weight: 700; color: var(--accent-color); }
        .vendor-zone { font-size: 0.9rem; color: var(--text-muted); background-color: var(--badge-bg); padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border-color); }
        
        .item-list { list-style: none; margin: 0; padding: 0; }
        .item-row {
            padding: 12px 16px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        .item-row:last-child { border-bottom: none; }
        .item-title { font-weight: 600; color: #cbe3f7; }
        .item-meta { display: flex; gap: 8px; align-items: center; font-size: 0.85rem; }
        .meta-tag { background-color: var(--badge-bg); padding: 3px 8px; border-radius: 4px; color: var(--text-muted); }
        .meta-price { color: #ffd700; font-weight: 600; }
        
        .unmatched-card { border-color: #5a2c2c; }
        .unmatched-card .vendor-header { background-color: rgba(229, 115, 115, 0.1); }
        .unmatched-card .vendor-name { color: #e57373; }
        .search-term-debug { font-size: 0.8rem; color: #777; margin-left: 8px; font-weight: normal; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>WoW Decor Sourcing Assistant</h1>
        <div id="statusBar" class="status-bar status-loading">
            <span id="statusText">Fetching lua files from server...</span>
        </div>
    </header>

    <label for="itemListInput"><strong>Paste List of Decor Items (Preserves your raw line format):</strong></label>
    <textarea id="itemListInput" placeholder="45x Runed Stone Placard&#10;7x Three-Candle Wrought Iron Chandelier&#10;1x Elwynn Autumn Apple Tree&#10;15x Orange Housing Dye (dye)"></textarea>

    <button id="matchBtn" onclick="runMatcher()" disabled>Match Decor Sources</button>

    <div id="results" class="results-container"></div>
</div>

<script>
    let decorDatabase = [];
    const knownCurrencies = {
        823: "Apexis Crystals", 824: "Garrison Resources", 1155: "Ancient Mana",
        1220: "Order Resources", 1508: "Sightless Eyes", 1560: "War Resources",
        1792: "Honor", 1813: "Reservoir Anima", 2003: "Dragon Isles Supplies",
        2815: "Resonance Crystals", 3316: "Resonating Bravery", 3363: "Artisan Tokens",
        3448: "Undercoin", 37829: "Brewfest Tokens"
    };

    window.addEventListener('DOMContentLoaded', async () => {
        const statusBar = document.getElementById('statusBar');
        const statusText = document.getElementById('statusText');
        const matchBtn = document.getElementById('matchBtn');

        try {
            const cacheBuster = '?v=' + Date.now();
            const [activeRes, galleryRes] = await Promise.all([
                fetch('./ActiveItems.lua' + cacheBuster),
                fetch('./GalleryVendorDetails.lua' + cacheBuster)
            ]);

            if (!activeRes.ok || !galleryRes.ok) {
                throw new Error(`HTTP Error: ActiveItems (${activeRes.status}) / Gallery (${galleryRes.status})`);
            }

            const activeText = await activeRes.text();
            const galleryText = await galleryRes.text();

            buildDatabase(activeText, galleryText);

            if (decorDatabase.length === 0) {
                throw new Error("Files loaded, but no decor items were successfully parsed.");
            }

            statusBar.className = "status-bar status-success";
            statusText.textContent = `✓ Successfully loaded database (${decorDatabase.length} decor sources mapped).`;
            matchBtn.disabled = false;
            
        } catch (err) {
            statusBar.className = "status-bar status-error";
            statusText.textContent = `Error: ${err.message}`;
            console.error(err);
        }
    });

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function buildDatabase(activeStr, galleryStr) {
        const vendorNames = {};
        const vendorZones = {};
        const itemVendorDetails = {};

        function recordGalleryEntry(itemId, vendorId, content) {
            if (!itemVendorDetails[itemId]) itemVendorDetails[itemId] = {};

            const zoneMatch = content.match(/displayZone\s*=\s*"([^"]+)"/);
            const zone = zoneMatch ? zoneMatch[1].trim() : null;
            if (zone) vendorZones[vendorId] = zone;

            let priceFormatted = "";
            const priceTextMatch = content.match(/priceText\s*=\s*"([^"]+)"/);
            const currMatch = content.match(/currencyID\s*=\s*(\d+)/);
            const amtMatch = content.match(/amount\s*=\s*(\d+)/);
            const moneyMatch = content.match(/money\s*=\s*(\d+)/);

            if (priceTextMatch) priceFormatted = priceTextMatch[1].trim() + "g";
            else if (currMatch && amtMatch) {
                const cId = currMatch[1];
                const cName = knownCurrencies[cId] || `Currency #${cId}`;
                priceFormatted = `${amtMatch[1]} ${cName}`;
            } else if (moneyMatch) priceFormatted = `${Math.floor(parseInt(moneyMatch[1]) / 10000)}g`;

            let reqFormatted = "";
            const facMatch = content.match(/faction\s*=\s*"([^"]+)"/);
            const rankMatch = content.match(/rank\s*=\s*"?([^",}]+)"?/);
            if (facMatch && rankMatch) reqFormatted = `${facMatch[1]} (${rankMatch[1]})`;

            itemVendorDetails[itemId][vendorId] = { zone, price: priceFormatted, requirement: reqFormatted };
        }

        if (galleryStr) {
            let currentRootItemId = null;
            for (let rawLine of galleryStr.split('\n')) {
                const line = rawLine.trim();
                if (!line || line.startsWith('--')) continue;

                const doubleMatch = line.match(/\[(\d+)\]\s*=\s*\{\s*\[(\d+)\]\s*=\s*\{([\s\S]+)\}/);
                if (doubleMatch) {
                    recordGalleryEntry(doubleMatch[1], doubleMatch[2], doubleMatch[3]);
                    continue;
                }
                
                const rootMatch = line.match(/^\[(\d+)\]\s*=\s*\{/);
                if (rootMatch && !line.includes('displayZone')) {
                    currentRootItemId = rootMatch[1];
                    continue;
                }

                const nestedMatch = line.match(/^\[(\d+)\]\s*=\s*\{([\s\S]+)\}/);
                if (nestedMatch && currentRootItemId) {
                    recordGalleryEntry(currentRootItemId, nestedMatch[1], nestedMatch[2]);
                    continue;
                }
                if (line.startsWith('},') || line === '}') currentRootItemId = null;
            }
        }

        let currentHeaderVendors = [];
        let currentSectionType = "vendor";
        decorDatabase = [];

        for (let rawLine of activeStr.split('\n')) {
            const line = rawLine.trim();

            if (line.includes("VENDOR NPC:")) {
                currentHeaderVendors = [];
                currentSectionType = "vendor";
                for (let vp of line.matchAll(/(\d+)\s*\(([^)]+)\)/g)) {
                    vendorNames[vp[1]] = vp[2].replace(/\s+\d+$/, '').trim(); 
                    currentHeaderVendors.push(vp[1]);
                }
                continue;
            } else if (line.includes("Cursed Keepsake Quests") || line.includes("Daily Quest") || line.includes("quest")) {
                currentSectionType = line.includes("Cursed") ? "Cursed Keepsake Quest" : "Quest";
                currentHeaderVendors = [];
                continue;
            }

            const lineMatch = rawLine.match(/\[(\d+)\]\s*=\s*\{(.*)\}\s*--\s*(.*)/);
            if (lineMatch) {
                const itemId = lineMatch[1];
                const itemBody = lineMatch[2];
                let itemName = lineMatch[3].trim().split(" = ")[0].trim();
                
                const decorIdMatch = itemBody.match(/decorID\s*=\s*(\d+)/);
                const sourceMatch = itemBody.match(/source\s*=\s*"([^"]+)"/);
                const zoneMatch = itemBody.match(/zone\s*=\s*"([^"]+)"/);
                const soldByMatch = itemBody.match(/soldBy\s*=\s*\{([^}]+)\}/);

                let associatedVendors = soldByMatch ? soldByMatch[1].split(',').map(s => s.trim()).filter(Boolean) : [...currentHeaderVendors];

                if (associatedVendors.length > 0) {
                    for (let vId of associatedVendors) {
                        const details = itemVendorDetails[itemId]?.[vId] || {};
                        decorDatabase.push({
                            itemId,
                            decorId: decorIdMatch ? decorIdMatch[1] : null,
                            name: itemName,
                            source: sourceMatch ? sourceMatch[1] : "vendor",
                            vendorName: vendorNames[vId] || `Vendor (${vId})`,
                            zone: details.zone || vendorZones[vId] || (zoneMatch ? zoneMatch[1] : "World"),
                            price: details.price || "",
                            requirement: details.requirement || ""
                        });
                    }
                } else {
                    decorDatabase.push({
                        itemId,
                        decorId: decorIdMatch ? decorIdMatch[1] : null,
                        name: itemName,
                        source: sourceMatch ? sourceMatch[1] : "Quest / World",
                        vendorName: currentSectionType,
                        zone: zoneMatch ? zoneMatch[1] : "Various Zones",
                        price: "", requirement: ""
                    });
                }
            }
        }
    }

    function getEditDistance(a, b) {
        if (a.length === 0) return b.length;
        if (b.length === 0) return a.length;
        const matrix = Array.from(Array(b.length + 1), () => Array(a.length + 1).fill(0));
        for (let i = 0; i <= a.length; i++) matrix[0][i] = i;
        for (let j = 0; j <= b.length; j++) matrix[j][0] = j;
        for (let j = 1; j <= b.length; j++) {
            for (let i = 1; i <= a.length; i++) {
                const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                matrix[j][i] = Math.min(matrix[j][i - 1] + 1, matrix[j - 1][i] + 1, matrix[j - 1][i - 1] + cost);
            }
        }
        return matrix[b.length][a.length];
    }

    function runMatcher() {
        const searchLines = document.getElementById('itemListInput').value.split('\n').map(s => s.trim()).filter(Boolean);
        const resultsDiv = document.getElementById('results');

        if (searchLines.length === 0) return;

        const vendorGroups = {};
        const unmatched = [];

        for (let rawLine of searchLines) {
            let cleanQuery = rawLine.replace(/^[^a-zA-Z0-9]+/, '').replace(/^\d+\s*[xX*]\s*/i, '').replace(/\s*\([^)]*\)\s*$/, '').trim();
            const cleanLower = cleanQuery.toLowerCase();
            let match = null;

            if (/^\d+$/.test(cleanQuery)) {
                match = decorDatabase.filter(d => d.decorId === cleanQuery || d.itemId === cleanQuery);
            }

            if (!match || match.length === 0) {
                const exact = decorDatabase.filter(d => d.name.toLowerCase() === cleanLower);
                if (exact.length > 0) match = exact;
            }

            if (!match || match.length === 0) {
                const substr = decorDatabase.filter(d => cleanLower.includes(d.name.toLowerCase()) || (cleanLower.length > 3 && d.name.toLowerCase().includes(cleanLower)));
                if (substr.length > 0) {
                    substr.sort((a, b) => b.name.length - a.name.length);
                    match = substr.filter(d => d.name.length === substr[0].name.length);
                }
            }

            if (!match || match.length === 0) {
                let bestName = null, bestDist = Infinity;
                for (let d of decorDatabase) {
                    const dist = getEditDistance(cleanLower, d.name.toLowerCase());
                    if (dist < bestDist) { bestDist = dist; bestName = d.name; }
                }
                const maxAllowed = Math.max(2, Math.floor(cleanLower.length * 0.25));
                if (bestName && bestDist <= maxAllowed) match = decorDatabase.filter(d => d.name === bestName);
            }

            if (match && match.length > 0) {
                for (let item of match) {
                    const groupKey = `${item.vendorName}:::${item.zone}`;
                    if (!vendorGroups[groupKey]) vendorGroups[groupKey] = { vendor: item.vendorName, zone: item.zone, items: [] };
                    
                    if (!vendorGroups[groupKey].items.some(i => i.rawInput === rawLine && i.name === item.name)) {
                        vendorGroups[groupKey].items.push({ ...item, rawInput: rawLine });
                    }
                }
            } else {
                unmatched.push({ raw: rawLine, clean: cleanQuery });
            }
        }

        renderOutput(vendorGroups, unmatched);
    }

    function renderOutput(groups, unmatched) {
        const resultsDiv = document.getElementById('results');
        let html = "";
        const groupKeys = Object.keys(groups).sort(); 

        if (groupKeys.length === 0 && unmatched.length === 0) {
            resultsDiv.innerHTML = "<p>No matching items found.</p>";
            return;
        }

        for (let key of groupKeys) {
            const grp = groups[key];
            
            // Sort items alphabetically by their actual database name, completely ignoring the quantities in the raw string
            grp.items.sort((a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));

            html += `
                <div class="vendor-card">
                    <div class="vendor-header">
                        <span class="vendor-name">${escapeHtml(grp.vendor)}</span>
                        <span class="vendor-zone">📍 ${escapeHtml(grp.zone)}</span>
                    </div>
                    <ul class="item-list">`;

            for (let itm of grp.items) {
                html += `
                    <li class="item-row">
                        <div>
                            <div class="item-title">${escapeHtml(itm.rawInput)}</div>
                            ${itm.requirement ? `<span class="meta-tag" style="color: #f0c674;">Req: ${escapeHtml(itm.requirement)}</span>` : ''}
                        </div>
                        <div class="item-meta">
                            ${itm.price ? `<span class="meta-price">${escapeHtml(itm.price)}</span>` : ''}
                            <span class="meta-tag" style="text-transform: capitalize;">${escapeHtml(itm.source)}</span>
                        </div>
                    </li>`;
            }
            html += `</ul></div>`;
        }

        if (unmatched.length > 0) {
            html += `
                <div class="vendor-card unmatched-card">
                    <div class="vendor-header">
                        <span class="vendor-name">Not Found / Unmatched Items</span>
                        <span class="vendor-zone">${unmatched.length} Item(s)</span>
                    </div>
                    <ul class="item-list">`;
            for (let u of unmatched) {
                html += `<li class="item-row">
                            <span style="color: var(--text-muted);">${escapeHtml(u.raw)}</span>
                            <span class="search-term-debug">(Searched DB for: "${escapeHtml(u.clean)}")</span>
                         </li>`;
            }
            html += `</ul></div>`;
        }
        resultsDiv.innerHTML = html;
    }
</script>

</body>
</html>
